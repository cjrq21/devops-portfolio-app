# ... (la parte del Service déjala igual) ...
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-portfolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-portfolio
  template:
    metadata:
      labels:
        app: devops-portfolio
    spec:
      automountServiceAccountToken: false
      containers:
      - name: devops-portfolio
        image: cjrq21/devops-portfolio:53
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
            ephemeral-storage: "100Mi"
          limits:
            memory: "128Mi"
            cpu: "200m"
            ephemeral-storage: "200Mi"
        env:
        - name: REDIS_HOST
          value: "redis-db"  # <--- CAMBIO AQUÍ (Apuntamos al nuevo nombre)